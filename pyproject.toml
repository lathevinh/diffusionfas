[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusionfas"
version = "0.1.0"
description = "Offline-first bonafide-only short-clip diffusion PAD research"
requires-python = ">=3.12"
dependencies = [
  "numpy==1.26.4",
  "torch==2.7.1",
  "opencv-python-headless==4.11.0.86",
  "diffusers==0.35.1",
  "safetensors==0.5.3",
  "scikit-learn==1.6.1",
]

[project.scripts]
diffusionfas = "diffusionfas.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
